<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF配置エディター</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; font-family: "Yu Gothic UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #f3f5f8; border-bottom: 1px solid #d5dae1; }
    header span { flex: 1; font-size: 13px; }
    button { padding: 7px 14px; cursor: pointer; }
    #apply { background: #145dbb; color: white; border: 1px solid #145dbb; border-radius: 4px; }
    #cancel { background: white; border: 1px solid #9da5af; border-radius: 4px; }
    #designer { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <header>
    <span>項目を選ぶと右側で色・回転・行間・枠線などを設定できます。変更内容は「配置を反映」で保存されます。</span>
    <button id="cancel" type="button">キャンセル</button>
    <button id="apply" type="button" disabled>配置を反映</button>
  </header>
  <div id="designer"></div>
  <script type="module" src="./dist/editor.js"></script>
</body>
</html>
